# ansible.cfg
[defaults]
inventory = ./inventories/hosts.yml
vault_password_file = ~/.vault_pass.txt
interpreter_python = auto_silent
callbacks_enabled = timer, profile_tasks
host_key_checking = True

[ssh_connection]
# Accept new/unknown host keys silently (adds them to known_hosts),
# but refuse if a known host's key has changed — protecting against MITM.
# Preserve Ansible's default SSH multiplexing args (-C -o ControlMaster... -o ControlPersist...).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10