#SPDX-License-Identifier: MIT-0
##
## ROLE: deploy-wireguard
## PURPOSE: Install and configure WireGuard VPN server on the BackEnd server.
##
## CONTEXT:
##   - Targets BackEnd server only.
##   - Runs as root (become: true).
##   - Must run AFTER serversconf (SSH hardening, custom port in place).
##   - Server key pair must already exist in ssh_keys/ on the control node:
##       ssh_keys/wireguard_server_private.key
##       ssh_keys/wireguard_server_public.key
##
## KEY VARIABLES:
##   wireguard_enabled       : true/false — install or skip (group_vars/BackEnd.yml).
##   wireguard_port          : UDP listen port (group_vars/all/vars.yml, default 51820).
##   wireguard_server_address: VPN interface address with prefix (group_vars/all/vars.yml).
##
## WHAT THIS ROLE DOES (in order):
##   1. Reports configuration (host, enabled flag, port, address).
##   2. Installs the wireguard package.
##   3. Creates /etc/wireguard/ with mode 0700.
##   4. Deploys server private key to /etc/wireguard/server_private.key (mode 0600, no_log).
##   5. Deploys server public key to /etc/wireguard/server_public.key (mode 0644).
##   6. Deploys /etc/wireguard/wg0.conf from template (mode 0600, no_log), notifies restart.
##   7. Enables and starts wg-quick@wg0.
##
---

- name: "INFO: WireGuard configuration"
  ansible.builtin.debug:
    msg:
      - "host={{ inventory_hostname }}"
      - "wireguard_enabled={{ wireguard_enabled }}"
      - "port={{ wireguard_port }}"
      - "address={{ wireguard_server_address }}"

- name: "INFO: Install WireGuard package"
  ansible.builtin.debug:
    msg: "package=wireguard"
  when: wireguard_enabled | bool

- name: "APPLY: Install WireGuard"
  ansible.builtin.package:
    name: wireguard
    state: present
  when: wireguard_enabled | bool

- name: "INFO: Create /etc/wireguard directory"
  ansible.builtin.debug:
    msg: "path=/etc/wireguard | owner=root | mode=0700"
  when: wireguard_enabled | bool

- name: "APPLY: Ensure /etc/wireguard directory exists"
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: wireguard_enabled | bool

- name: "INFO: Deploy server private key"
  ansible.builtin.debug:
    msg: "src=ssh_keys/wireguard_server_private.key | dest=/etc/wireguard/server_private.key | mode=0600"
  when: wireguard_enabled | bool

- name: "APPLY: Deploy server private key"
  ansible.builtin.copy:
    content: "{{ lookup('file', playbook_dir + '/ssh_keys/wireguard_server_private.key') | trim }}\n"
    dest: /etc/wireguard/server_private.key
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: wireguard_enabled | bool

- name: "INFO: Deploy server public key"
  ansible.builtin.debug:
    msg: "src=ssh_keys/wireguard_server_public.key | dest=/etc/wireguard/server_public.key | mode=0644"
  when: wireguard_enabled | bool

- name: "APPLY: Deploy server public key"
  ansible.builtin.copy:
    content: "{{ lookup('file', playbook_dir + '/ssh_keys/wireguard_server_public.key') | trim }}\n"
    dest: /etc/wireguard/server_public.key
    owner: root
    group: root
    mode: '0644'
  when: wireguard_enabled | bool

- name: "INFO: Deploy wg0.conf"
  ansible.builtin.debug:
    msg: "dest=/etc/wireguard/wg0.conf | port={{ wireguard_port }} | address={{ wireguard_server_address }}"
  when: wireguard_enabled | bool

- name: "APPLY: Deploy wg0.conf from template"
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart wg0
  when: wireguard_enabled | bool

- name: "INFO: Enable and start wg-quick@wg0"
  ansible.builtin.debug:
    msg: "service=wg-quick@wg0 | state=started | enabled=yes"
  when: wireguard_enabled | bool

- name: "APPLY: Enable and start wg-quick@wg0"
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  when: wireguard_enabled | bool
